# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  pull_request:
  push:
    branches:
      - main

name: CI

jobs:

  coding-guidelines:
    name: Coding Guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run friendsofphp/php-cs-fixer
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --show-progress=dots --using-cache=no --verbose

  type-checker:
    name: Type Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run psalm
        run: ./vendor/bin/psalm --config=psalm.xml --no-progress --shepherd --show-info=false --stats --output-format=github

      - name: Run phpstan
        run: ./vendor/bin/phpstan analyze -c phpstan.neon src

  tests:
    name: "PHP version ${{ matrix.php-version }}, deps. ${{ matrix.dependencies }}"
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        dependencies: [ "locked", "highest" ]
        php-version: [ "8.3", "8.4", "8.5" ]
        operating-system:
          - "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}"

      - name: "Install locked dependencies"
        if: ${{ matrix.dependencies == 'locked' }}
        run: "composer install --no-interaction --no-progress"

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: "composer update --no-interaction --no-progress"

      - name: Run tests
        run: vendor/bin/phpunit

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # 8.4, not the 8.3 floor: native lazy objects only exist from 8.4, so
          # on 8.3 the #[Lazy] path is unreachable and reads as uncovered.
          php-version: 8.4
          coverage: pcov
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

      - name: Enforce minimum line coverage
        run: php tools/check-coverage.php coverage.xml 95

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage.xml

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Required. It was advisory pending a measurement of the false-positive
    # rate on shared runners; #150 shipped a 12% regression with this job green,
    # which is what an advisory gate is worth.
    #
    # The comparison only runs on a pull request. On a push to main the merge
    # base *is* the commit, so it compared identical code against itself — and
    # still reported +7.6% to +12.7% on four subjects, which is how the
    # shared-runner noise floor was actually measured. See the gate thresholds
    # in ContainerBench.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      # Discarded on purpose. The first phpbench invocation of a job pays for a
      # cold opcache and page cache, and measures several times noisier than the
      # second — so storing the baseline on it inflated the baseline and
      # flattered every candidate, biasing the comparison towards missing
      # regressions rather than flagging them.
      - name: Warm the caches, discarding the result
        run: vendor/bin/phpbench run --progress=none --iterations=1

      - name: Store a baseline from the merge base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git stash push --include-untracked || true
          git checkout FETCH_HEAD -- src benchmarks || true
          vendor/bin/phpbench run --tag=baseline --store --progress=none
          git checkout HEAD -- src benchmarks
          git stash pop || true

      # Written to a file first so the table can be posted to the PR whether the
      # assertions passed or failed — a regression is exactly when a reviewer
      # most wants to see the numbers, and a job log is not where they look.
      - name: Compare against the baseline
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          set +e
          vendor/bin/phpbench run --ref=baseline --report=aggregate | tee benchmark-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # On a push there is nothing to compare against, so this only proves the
      # suite still runs — a benchmark that throws is a real failure.
      - name: Run the suite
        if: github.event_name != 'pull_request'
        run: vendor/bin/phpbench run --progress=none

      - name: Post the comparison on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '<!-- gacela-benchmarks -->'
            echo '### Benchmarks vs `${{ github.event.pull_request.base.ref }}`'
            echo
            echo '```'
            # The table only; the progress lines above it are ANSI noise.
            sed -n '/^+/,$p' benchmark-report.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none

      - name: Fail if any subject regressed
        if: github.event_name == 'pull_request'
        run: exit ${{ steps.compare.outputs.status }}

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: pcov
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run Infection
        run: vendor/bin/infection --threads=max --no-interaction --no-progress --logger-github
